name = "enshrouded-server-config"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Cloudflare D1 (SQLite). Create with:
#   wrangler d1 create enshrouded_config
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "enshrouded_config"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Analytics runs entirely through consent-gated Google Tag Manager + GA4 (client
# side, loaded only after consent). There is no first-party event sink and no
# custom dashboard — GA4 owns reporting — so no Analytics Engine binding is used.
# The GTM container id + GA4 measurement id are PUBLIC vars set as Pages env
# vars (see .dev.vars.example / docs/TRACKING_SPEC.md).
